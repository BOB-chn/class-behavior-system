<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师端 - 704班行为管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 20px 24px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-emoji {
            font-size: 32px;
        }
        
        .header-title {
            font-size: 22px;
            font-weight: bold;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .user-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .header-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        
        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
        }
        
        .stat-card.warning {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }
        
        .stat-card.orange {
            background: linear-gradient(135deg, #ffa502 0%, #ff6348 100%);
        }
        
        .stat-card.green {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        
        .stat-emoji {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 4px;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        
        .chart-container {
            height: 350px;
        }
        
        .chart-container-sm {
            height: 280px;
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 10px 20px;
            border: none;
            background: #f0f0f0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        .tab:hover:not(.active) {
            background: #e0e0e0;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* 预警列表 */
        .warning-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .warning-item {
            padding: 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .warning-item:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .warning-item.red {
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            border-left: 4px solid #f44336;
        }
        
        .warning-item.orange {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            border-left: 4px solid #ff9800;
        }
        
        .warning-icon {
            font-size: 28px;
        }
        
        .warning-info {
            flex: 1;
        }
        
        .warning-name {
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .warning-reason {
            font-size: 13px;
            color: #666;
        }
        
        /* 排行榜 */
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .leaderboard-table th,
        .leaderboard-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        
        .leaderboard-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #666;
            font-size: 13px;
        }
        
        .leaderboard-table tbody tr:hover {
            background: #f8f9fa;
        }
        
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
        }
        
        .rank-1 { background: linear-gradient(135deg, #ffd700 0%, #ffb700 100%); color: white; }
        .rank-2 { background: linear-gradient(135deg, #c0c0c0 0%, #a8a8a8 100%); color: white; }
        .rank-3 { background: linear-gradient(135deg, #cd7f32 0%, #b8690b 100%); color: white; }
        .rank-other { background: #f0f0f0; color: #666; }
        
        .status-tag {
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
        }
        
        .status-normal { background: #e8f5e9; color: #43a047; }
        .status-warning { background: #fff3e0; color: #ff9800; }
        .status-alert { background: #ffebee; color: #f44336; }
        
        .score-positive { color: #43e97b; font-weight: bold; }
        .score-negative { color: #ff6b6b; font-weight: bold; }
        
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        
        .detail-item {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }
        
        .detail-item .value {
            font-size: 20px;
            font-weight: bold;
            color: #4facfe;
        }
        
        .detail-item .label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        
        /* 学生详情弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background: white;
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(20px);
            transition: transform 0.3s;
        }
        
        .modal-overlay.show .modal {
            transform: translateY(0);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: bold;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        
        .modal-close:hover {
            color: #666;
        }
        
        .refresh-btn {
            background: #f0f0f0;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .refresh-btn:hover {
            background: #e0e0e0;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .empty-state .emoji {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-row {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .detail-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <span class="header-emoji">👩‍🏫</span>
            <span class="header-title">教师端</span>
        </div>
        <div class="header-right">
            <span class="user-info" id="userInfo">👋 你好！</span>
            <button class="header-btn" onclick="refreshCache()">🔄 刷新缓存</button>
            <button class="header-btn" onclick="exportData()">📥 导出数据</button>
            <button class="header-btn" onclick="logout()">退出</button>
        </div>
    </header>
    
    <div class="container">
        <!-- 统计卡片 -->
        <div class="stats-row" id="statsRow">
            <div class="stat-card">
                <div class="stat-emoji">👥</div>
                <div class="stat-value" id="totalStudents">-</div>
                <div class="stat-label">班级人数</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-emoji">⚠️</div>
                <div class="stat-value" id="warningCount">-</div>
                <div class="stat-label">预警人数</div>
            </div>
            <div class="stat-card green">
                <div class="stat-emoji">📝</div>
                <div class="stat-value" id="todayRecords">-</div>
                <div class="stat-label">今日记录</div>
            </div>
            <div class="stat-card orange">
                <div class="stat-emoji">📉</div>
                <div class="stat-value" id="todayViolations">-</div>
                <div class="stat-label">今日违规</div>
            </div>
            <div class="stat-card">
                <div class="stat-emoji">📊</div>
                <div class="stat-value" id="avgScore">-</div>
                <div class="stat-label">平均积分</div>
            </div>
        </div>
        
        <!-- 标签页 -->
        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('overview')">📊 数据概览</button>
                <button class="tab" onclick="switchTab('warnings')">⚠️ 预警名单</button>
                <button class="tab" onclick="switchTab('leaderboard')">🏆 排行榜</button>
                <button class="tab" onclick="switchTab('distribution')">📈 分布统计</button>
            </div>
            
            <!-- 数据概览 -->
            <div class="tab-content active" id="overview">
                <div class="main-grid">
                    <!-- 排行榜TOP10 -->
                    <div>
                        <div class="card-title">🏆 积分排行榜 TOP10</div>
                        <table class="leaderboard-table">
                            <thead>
                                <tr>
                                    <th>排名</th>
                                    <th>姓名</th>
                                    <th>总积分</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="top10Body"></tbody>
                        </table>
                    </div>
                    
                    <!-- 预警列表 -->
                    <div>
                        <div class="card-title">⚠️ 需要关注</div>
                        <div class="warning-list" id="warningList"></div>
                    </div>
                </div>
            </div>
            
            <!-- 预警名单 -->
            <div class="tab-content" id="warnings">
                <div class="warning-list" id="fullWarningList"></div>
            </div>
            
            <!-- 排行榜 -->
            <div class="tab-content" id="leaderboard">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>排名</th>
                            <th>姓名</th>
                            <th>学号</th>
                            <th>总积分</th>
                            <th>作业</th>
                            <th>卫生</th>
                            <th>纪律</th>
                            <th>体育</th>
                            <th>文明</th>
                            <th>状态</th>
                            <th>详情</th>
                        </tr>
                    </thead>
                    <tbody id="fullLeaderboardBody"></tbody>
                </table>
            </div>
            
            <!-- 分布统计 -->
            <div class="tab-content" id="distribution">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <div class="card-title">📊 积分分布</div>
                        <div class="chart-container-sm" id="distributionChart"></div>
                    </div>
                    <div>
                        <div class="card-title">📈 今日行为类别</div>
                        <div class="chart-container-sm" id="categoryChart"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 学生详情弹窗 -->
    <div class="modal-overlay" id="studentModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">学生详情</span>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>
    
    <script>
        let userName = '';
        let leaderboard = [];
        let distributionChart, categoryChart, trendChart, radarChart;
        
        // 检查登录状态
        function checkAuth() {
            const role = sessionStorage.getItem('userRole');
            userName = sessionStorage.getItem('userName') || '';
            
            if (!role || role !== 'teacher') {
                window.location.href = '/';
                return false;
            }
            
            document.getElementById('userInfo').textContent = `👋 ${userName}，您好！`;
            return true;
        }
        
        function logout() {
            sessionStorage.clear();
            window.location.href = '/';
        }
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
            
            // 调整图表大小
            if (tabId === 'distribution') {
                setTimeout(() => {
                    if (distributionChart) distributionChart.resize();
                    if (categoryChart) categoryChart.resize();
                }, 100);
            }
        }
        
        // 加载数据
        async function loadData() {
            // 加载教师看板
            const dashRes = await fetch('/api/teacher/dashboard');
            const dash = await dashRes.json();
            
            if (dash.stats) {
                document.getElementById('totalStudents').textContent = dash.stats.total_students || 0;
                document.getElementById('todayRecords').textContent = dash.stats.today_total_records || 0;
                document.getElementById('todayViolations').textContent = dash.stats.today_violations || 0;
                document.getElementById('avgScore').textContent = Math.round(dash.stats.average_score || 0);
            }
            
            // 预警数
            const warningCount = dash.warnings?.length || 0;
            document.getElementById('warningCount').textContent = warningCount;
            
            // 排行榜
            leaderboard = dash.leaderboard_top10 || [];
            loadLeaderboard();
            loadFullLeaderboard();
            
            // 预警列表
            loadWarnings(dash.warnings || []);
            
            // 分布统计
            if (dash.stats) {
                initDistributionChart(dash.stats.score_distribution);
                initCategoryChart(dash.stats.category_today);
            }
        }
        
        function loadLeaderboard() {
            const tbody = document.getElementById('top10Body');
            
            tbody.innerHTML = leaderboard.map(s => {
                let rankClass = s.rank <= 3 ? `rank-${s.rank}` : 'rank-other';
                let statusClass = s.status === '预警' ? 'status-alert' : 
                                  s.status === '关注' ? 'status-warning' : 'status-normal';
                
                return `
                    <tr>
                        <td><span class="rank-badge ${rankClass}">${s.rank <= 3 ? ['🥇','🥈','🥉'][s.rank-1] : s.rank}</span></td>
                        <td><strong>${s.name}</strong></td>
                        <td class="score-positive">${s.total}</td>
                        <td><span class="status-tag ${statusClass}">${s.status || '正常'}</span></td>
                        <td><button class="tab" onclick="showStudentDetail('${s.name}')" style="padding: 6px 12px; font-size: 12px;">查看详情</button></td>
                    </tr>
                `;
            }).join('');
        }
        
        async function loadFullLeaderboard() {
            const res = await fetch('/api/leaderboard');
            const data = await res.json();
            
            const tbody = document.getElementById('fullLeaderboardBody');
            const lb = data.leaderboard || [];
            
            // 获取学生档案中的学号
            const healthRes = await fetch('/api/health');
            
            tbody.innerHTML = lb.map(s => {
                let rankClass = s.rank <= 3 ? `rank-${s.rank}` : 'rank-other';
                let statusClass = s.status === '预警' ? 'status-alert' : 
                                  s.status === '关注' ? 'status-warning' : 'status-normal';
                
                return `
                    <tr>
                        <td><span class="rank-badge ${rankClass}">${s.rank <= 3 ? ['🥇','🥈','🥉'][s.rank-1] : s.rank}</span></td>
                        <td><strong>${s.name}</strong></td>
                        <td>-</td>
                        <td class="score-positive">${s.total}</td>
                        <td>${s.homework}</td>
                        <td>${s.hygiene}</td>
                        <td>${s.discipline}</td>
                        <td>${s.sports}</td>
                        <td>${s.civil}</td>
                        <td><span class="status-tag ${statusClass}">${s.status || '正常'}</span></td>
                        <td><button class="tab" onclick="showStudentDetail('${s.name}')" style="padding: 6px 12px; font-size: 12px;">详情</button></td>
                    </tr>
                `;
            }).join('');
        }
        
        function loadWarnings(warnings) {
            const list = document.getElementById('warningList');
            const fullList = document.getElementById('fullWarningList');
            
            const html = warnings.length === 0 ? `
                <div class="empty-state">
                    <div class="emoji">🎉</div>
                    <div>暂无预警同学，表现都很棒！</div>
                </div>
            ` : warnings.map(w => `
                <div class="warning-item ${w.type}" onclick="showStudentDetail('${w.student}')">
                    <span class="warning-icon">${w.type === 'red' ? '🔴' : '🟠'}</span>
                    <div class="warning-info">
                        <div class="warning-name">${w.student}</div>
                        <div class="warning-reason">${w.reason}</div>
                    </div>
                </div>
            `).join('');
            
            list.innerHTML = html;
            fullList.innerHTML = html;
        }
        
        function initDistributionChart(distribution) {
            if (!distribution) return;
            
            if (!distributionChart) {
                distributionChart = echarts.init(document.getElementById('distributionChart'));
            }
            
            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {c}人 ({d}%)'
                },
                color: ['#ff6b6b', '#ffa502', '#4facfe', '#43e97b', '#667eea'],
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 10,
                        borderColor: '#fff',
                        borderWidth: 2
                    },
                    label: {
                        show: true,
                        formatter: '{b}\n{c}人'
                    },
                    data: [
                        { value: distribution['0-100'] || 0, name: '0-100' },
                        { value: distribution['100-200'] || 0, name: '100-200' },
                        { value: distribution['200-300'] || 0, name: '200-300' },
                        { value: distribution['300-400'] || 0, name: '300-400' },
                        { value: distribution['400+'] || 0, name: '400+' }
                    ]
                }]
            };
            
            distributionChart.setOption(option);
        }
        
        function initCategoryChart(categoryData) {
            if (!categoryData || Object.keys(categoryData).length === 0) return;
            
            if (!categoryChart) {
                categoryChart = echarts.init(document.getElementById('categoryChart'));
            }
            
            const categories = Object.keys(categoryData);
            const emojiMap = {
                '作业': '📚', '卫生': '🧹', '纪律': '📏',
                '体育锻炼': '⚽', '文明行为': '🌟', '其他': '📋'
            };
            
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    top: '10%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: categories.map(c => emojiMap[c] + c),
                    axisLabel: { fontSize: 11 }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: { fontSize: 11 }
                },
                series: [
                    {
                        name: '加分',
                        type: 'bar',
                        stack: 'total',
                        data: categories.map(c => categoryData[c].positive),
                        itemStyle: { color: '#43e97b' },
                        barWidth: 20
                    },
                    {
                        name: '扣分',
                        type: 'bar',
                        stack: 'total',
                        data: categories.map(c => -categoryData[c].negative),
                        itemStyle: { color: '#ff6b6b' },
                        barWidth: 20
                    }
                ]
            };
            
            categoryChart.setOption(option);
        }
        
        async function showStudentDetail(name) {
            document.getElementById('modalTitle').textContent = `📋 ${name} 的详情`;
            document.getElementById('studentModal').classList.add('show');
            
            // 加载学生详情
            const profileRes = await fetch(`/api/student/profile?name=${encodeURIComponent(name)}`);
            const profile = await profileRes.json();
            
            const detailRes = await fetch(`/api/teacher/student-detail?name=${encodeURIComponent(name)}`);
            const detail = await detailRes.json();
            
            let detailHtml = `
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px;">
                    <div class="detail-item">
                        <div class="value">${profile.rank || '-'}</div>
                        <div class="label">班级排名</div>
                    </div>
                    <div class="detail-item">
                        <div class="value">${profile.total || 0}</div>
                        <div class="label">总积分</div>
                    </div>
                    <div class="detail-item">
                        <div class="value" style="color: ${profile.status === '预警' ? '#f44336' : profile.status === '关注' ? '#ff9800' : '#43a047'}">${profile.status || '正常'}</div>
                        <div class="label">当前状态</div>
                    </div>
                </div>
                
                <div class="detail-grid" style="margin-bottom: 20px;">
                    <div class="detail-item"><div class="value">${profile.homework || 0}</div><div class="label">📚 作业</div></div>
                    <div class="detail-item"><div class="value">${profile.hygiene || 0}</div><div class="label">🧹 卫生</div></div>
                    <div class="detail-item"><div class="value">${profile.discipline || 0}</div><div class="label">📏 纪律</div></div>
                    <div class="detail-item"><div class="value">${profile.sports || 0}</div><div class="label">⚽ 体育</div></div>
                    <div class="detail-item"><div class="value">${profile.civil || 0}</div><div class="label">🌟 文明</div></div>
                    <div class="detail-item"><div class="value">${profile.other || 0}</div><div class="label">📋 其他</div></div>
                </div>
            `;
            
            // 雷达图
            if (detail.radar) {
                detailHtml += `
                    <div style="margin-bottom: 20px;">
                        <div class="card-title">📊 六维度雷达图</div>
                        <div id="modalRadarChart" style="height: 280px;"></div>
                    </div>
                `;
            }
            
            // 趋势图
            if (detail.trend && detail.trend.length > 0) {
                detailHtml += `
                    <div>
                        <div class="card-title">📈 21天积分趋势</div>
                        <div id="modalTrendChart" style="height: 250px;"></div>
                    </div>
                `;
            }
            
            document.getElementById('modalContent').innerHTML = detailHtml;
            
            // 初始化弹窗中的图表
            setTimeout(() => {
                if (detail.radar) {
                    const radarEl = document.getElementById('modalRadarChart');
                    if (radarEl) {
                        const rc = echarts.init(radarEl);
                        rc.setOption({
                            radar: {
                                indicator: [
                                    { name: '📚 作业', max: 100 },
                                    { name: '🧹 卫生', max: 100 },
                                    { name: '📏 纪律', max: 100 },
                                    { name: '⚽ 体育', max: 100 },
                                    { name: '🌟 文明', max: 100 },
                                    { name: '📋 其他', max: 100 }
                                ],
                                shape: 'polygon',
                                splitNumber: 4
                            },
                            series: [{
                                type: 'radar',
                                data: [{
                                    value: [
                                        detail.radar.homework || 0,
                                        detail.radar.hygiene || 0,
                                        detail.radar.discipline || 0,
                                        detail.radar.sports || 0,
                                        detail.radar.civil || 0,
                                        detail.radar.other || 0
                                    ],
                                    areaStyle: { color: 'rgba(79, 172, 254, 0.3)' },
                                    lineStyle: { color: '#4facfe', width: 2 },
                                    itemStyle: { color: '#4facfe' }
                                }]
                            }]
                        });
                    }
                }
                
                if (detail.trend && detail.trend.length > 0) {
                    const trendEl = document.getElementById('modalTrendChart');
                    if (trendEl) {
                        const tc = echarts.init(trendEl);
                        tc.setOption({
                            tooltip: {
                                trigger: 'axis',
                                formatter: function(params) {
                                    const p = params[0];
                                    return `${p.name}<br/>当日: ${p.value}<br/>累计: ${detail.trend[p.dataIndex]?.cumulative || 0}`;
                                }
                            },
                            grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
                            xAxis: {
                                type: 'category',
                                data: detail.trend.map(t => t.date),
                                axisLabel: { fontSize: 10 }
                            },
                            yAxis: { type: 'value', axisLabel: { fontSize: 11 } },
                            series: [{
                                type: 'line',
                                smooth: true,
                                data: detail.trend.map(t => t.score),
                                areaStyle: {
                                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                        { offset: 0, color: 'rgba(79, 172, 254, 0.5)' },
                                        { offset: 1, color: 'rgba(79, 172, 254, 0.05)' }
                                    ])
                                },
                                lineStyle: { color: '#4facfe', width: 2 },
                                itemStyle: { color: '#4facfe' },
                                symbol: 'circle',
                                symbolSize: 4
                            }]
                        });
                    }
                }
            }, 100);
        }
        
        function closeModal() {
            document.getElementById('studentModal').classList.remove('show');
        }
        
        async function refreshCache() {
            const btn = event.target;
            btn.textContent = '⏳ 刷新中...';
            btn.disabled = true;
            
            const res = await fetch('/api/refresh');
            const data = await res.json();
            
            alert(data.success ? '✅ 缓存刷新成功！' : '❌ ' + data.message);
            
            btn.textContent = '🔄 刷新缓存';
            btn.disabled = false;
            
            if (data.success) {
                loadData();
            }
        }
        
        function exportData() {
            window.open('/api/teacher/export', '_blank');
        }
        
        // 点击弹窗外部关闭
        document.getElementById('studentModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        
        // ESC关闭弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
        
        // 初始化
        if (checkAuth()) {
            loadData();
            
            // 窗口调整时重绘图表
            window.addEventListener('resize', () => {
                if (distributionChart) distributionChart.resize();
                if (categoryChart) categoryChart.resize();
            });
        }
    </script>
</body>
</html>
