<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生端 - 704班行为管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #b2dfdb 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .header {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            padding: 20px 24px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-emoji {
            font-size: 32px;
        }
        
        .header-title {
            font-size: 22px;
            font-weight: bold;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .user-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        
        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
        }
        
        .stat-card.warning {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }
        
        .stat-card.orange {
            background: linear-gradient(135deg, #ffa502 0%, #ff6348 100%);
        }
        
        .stat-emoji {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 4px;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .chart-container {
            height: 320px;
        }
        
        .radar-container {
            height: 320px;
        }
        
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        
        .detail-item {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }
        
        .detail-item .emoji {
            font-size: 24px;
            margin-bottom: 6px;
        }
        
        .detail-item .value {
            font-size: 22px;
            font-weight: bold;
            color: #43e97b;
        }
        
        .detail-item .label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            margin-right: 12px;
        }
        
        .rank-1 {
            background: linear-gradient(135deg, #ffd700 0%, #ffb700 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 183, 0, 0.4);
        }
        
        .rank-2 {
            background: linear-gradient(135deg, #c0c0c0 0%, #a8a8a8 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(168, 168, 168, 0.4);
        }
        
        .rank-3 {
            background: linear-gradient(135deg, #cd7f32 0%, #b8690b 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(184, 105, 11, 0.4);
        }
        
        .rank-other {
            background: #f0f0f0;
            color: #666;
        }
        
        .warning-banner {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .warning-banner .icon {
            font-size: 32px;
        }
        
        .warning-banner .text {
            font-size: 16px;
        }
        
        .records-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .records-table th,
        .records-table td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        .records-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #666;
            font-size: 13px;
        }
        
        .records-table td {
            font-size: 14px;
        }
        
        .records-table tr:hover {
            background: #f8f9fa;
        }
        
        .score-positive {
            color: #43e97b;
            font-weight: bold;
        }
        
        .score-negative {
            color: #ff6b6b;
            font-weight: bold;
        }
        
        .category-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            background: #f0f0f0;
        }
        
        .report-section {
            margin-top: 20px;
        }
        
        .report-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            margin-bottom: 8px;
        }
        
        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        
        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: #43e97b;
        }
        
        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 233, 123, 0.4);
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 10px 20px;
            border: none;
            background: #f0f0f0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }
        
        .tab:hover:not(.active) {
            background: #e0e0e0;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .empty-state .emoji {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .refresh-btn {
            background: #f0f0f0;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .refresh-btn:hover {
            background: #e0e0e0;
        }
        
        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .detail-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .report-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <span class="header-emoji">👨‍🎓</span>
            <span class="header-title">学生端</span>
        </div>
        <div class="header-right">
            <span class="user-info" id="userInfo">👋 你好！</span>
            <button class="refresh-btn" onclick="loadData()">🔄 刷新</button>
            <button class="logout-btn" onclick="logout()">退出</button>
        </div>
    </header>
    
    <div class="container">
        <!-- 预警提示 -->
        <div class="warning-banner" id="warningBanner" style="display: none;">
            <span class="icon">⚠️</span>
            <span class="text" id="warningText"></span>
        </div>
        
        <!-- 统计卡片 -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-emoji">🏆</div>
                <div class="stat-value" id="rankValue">-</div>
                <div class="stat-label">班级排名</div>
            </div>
            <div class="stat-card">
                <div class="stat-emoji">⭐</div>
                <div class="stat-value" id="totalValue">-</div>
                <div class="stat-label">总积分</div>
            </div>
            <div class="stat-card">
                <div class="stat-emoji">👥</div>
                <div class="stat-value" id="totalStudents">-</div>
                <div class="stat-label">班级人数</div>
            </div>
            <div class="stat-card" id="statusCard">
                <div class="stat-emoji">✨</div>
                <div class="stat-value" id="statusValue">正常</div>
                <div class="stat-label">当前状态</div>
            </div>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 雷达图 -->
            <div class="card">
                <div class="card-title">📊 六维度表现</div>
                <div class="radar-container" id="radarChart"></div>
            </div>
            
            <!-- 21天趋势图 -->
            <div class="card">
                <div class="card-title">📈 21天积分趋势</div>
                <div class="chart-container" id="trendChart"></div>
            </div>
        </div>
        
        <!-- 各维度积分详情 -->
        <div class="card">
            <div class="card-title">📋 各维度积分</div>
            <div class="detail-grid">
                <div class="detail-item">
                    <div class="emoji">📚</div>
                    <div class="value" id="homeworkValue">-</div>
                    <div class="label">作业</div>
                </div>
                <div class="detail-item">
                    <div class="emoji">🧹</div>
                    <div class="value" id="hygieneValue">-</div>
                    <div class="label">卫生</div>
                </div>
                <div class="detail-item">
                    <div class="emoji">📏</div>
                    <div class="value" id="disciplineValue">-</div>
                    <div class="label">纪律</div>
                </div>
                <div class="detail-item">
                    <div class="emoji">⚽</div>
                    <div class="value" id="sportsValue">-</div>
                    <div class="label">体育锻炼</div>
                </div>
                <div class="detail-item">
                    <div class="emoji">🌟</div>
                    <div class="value" id="civilValue">-</div>
                    <div class="label">文明行为</div>
                </div>
                <div class="detail-item">
                    <div class="emoji">📋</div>
                    <div class="value" id="otherValue">-</div>
                    <div class="label">其他</div>
                </div>
            </div>
        </div>
        
        <!-- 行为记录 -->
        <div class="card">
            <div class="card-title">📝 最近行为记录</div>
            <div id="recordsContainer">
                <table class="records-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>类别</th>
                            <th>事项</th>
                            <th>分值</th>
                            <th>记录人</th>
                        </tr>
                    </thead>
                    <tbody id="recordsBody">
                    </tbody>
                </table>
                <div class="empty-state" id="emptyRecords">
                    <div class="emoji">📭</div>
                    <div>暂无行为记录</div>
                </div>
            </div>
        </div>
        
        <!-- 自主上报 -->
        <div class="card">
            <div class="card-title">✨ 自主上报好事</div>
            <div class="report-form">
                <div class="form-group">
                    <label class="form-label">行为类别</label>
                    <select class="form-select" id="reportCategory">
                        <option value="作业">📚 作业</option>
                        <option value="卫生">🧹 卫生</option>
                        <option value="纪律">📏 纪律</option>
                        <option value="体育锻炼">⚽ 体育锻炼</option>
                        <option value="文明行为">🌟 文明行为</option>
                        <option value="其他">📋 其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">分值（加分请输入正数）</label>
                    <input type="number" class="form-input" id="reportScore" placeholder="例如: 5" step="0.5">
                </div>
                <div class="form-group full-width">
                    <label class="form-label">事迹描述</label>
                    <textarea class="form-textarea" id="reportDesc" placeholder="请简要描述你的好行为..."></textarea>
                </div>
                <div class="form-group full-width">
                    <button class="submit-btn" onclick="submitReport()">✨ 提交上报</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let userName = '';
        let radarChart, trendChart;
        
        // 检查登录状态
        function checkAuth() {
            const role = sessionStorage.getItem('userRole');
            userName = sessionStorage.getItem('userName') || '';
            
            if (!role || role !== 'student') {
                window.location.href = '/';
                return false;
            }
            
            if (!userName) {
                window.location.href = '/';
                return false;
            }
            
            document.getElementById('userInfo').textContent = `👋 ${userName}，加油！`;
            return true;
        }
        
        function logout() {
            sessionStorage.clear();
            window.location.href = '/';
        }
        
        // 加载数据（带重试）
        async function loadData() {
            if (!userName) {
                console.error('userName为空，无法加载数据');
                return;
            }
            
            try {
                // 加载学生信息
                const profileRes = await fetch(`/api/student/profile?name=${encodeURIComponent(userName)}`);
                const profile = await profileRes.json();
                
                if (profile.error) {
                    console.error('加载失败:', profile.error);
                    // 如果是缓存未就绪，等1秒重试一次
                    if (profile.error.includes('不存在')) {
                        await new Promise(r => setTimeout(r, 1500));
                        const retryRes = await fetch(`/api/student/profile?name=${encodeURIComponent(userName)}`);
                        const retryData = await retryRes.json();
                        if (retryData.error) {
                            console.error('重试仍失败:', retryData.error);
                            return;
                        }
                        Object.assign(profile, retryData);
                    } else {
                        return;
                    }
                }
            
            // 更新统计
            document.getElementById('rankValue').textContent = profile.rank;
            document.getElementById('totalValue').textContent = profile.total;
            document.getElementById('totalStudents').textContent = profile.total_students;
            document.getElementById('statusValue').textContent = profile.status || '正常';
            
            // 各维度积分
            document.getElementById('homeworkValue').textContent = profile.homework;
            document.getElementById('hygieneValue').textContent = profile.hygiene;
            document.getElementById('disciplineValue').textContent = profile.discipline;
            document.getElementById('sportsValue').textContent = profile.sports;
            document.getElementById('civilValue').textContent = profile.civil;
            document.getElementById('otherValue').textContent = profile.other;
            
            // 预警
            if (profile.warning) {
                document.getElementById('warningBanner').style.display = 'flex';
                document.getElementById('warningText').textContent = `${profile.warning.level} ${profile.warning.reason}`;
                document.getElementById('statusCard').classList.add(profile.warning.type === 'red' ? 'warning' : 'orange');
            } else {
                document.getElementById('warningBanner').style.display = 'none';
            }
            
            // 绘制雷达图
            initRadarChart(profile.radar);
            
            // 加载行为记录
            loadRecords();
            
            // 加载趋势图
            loadTrend();
            } catch(err) {
                console.error('加载数据异常:', err);
            }
        }
        
        function initRadarChart(radar) {
            if (!radar) return;
            
            if (!radarChart) {
                radarChart = echarts.init(document.getElementById('radarChart'));
            }
            
            const radarVals = [
                radar.homework || 0,
                radar.hygiene || 0,
                radar.discipline || 0,
                radar.sports || 0,
                radar.civil || 0,
                radar.other || 0
            ];
            
            const option = {
                color: ['#43e97b', '#38f9d7'],
                tooltip: {
                    trigger: 'item',
                    formatter: function(params) {
                        const labels = ['作业','卫生','纪律','体育','文明','其他'];
                        let html = '<b>我的表现</b><br/><span style="color:#999">基线50=零加减分</span><br/>';
                        for(let i=0;i<6;i++){
                            const raw = params.value[i] - 50;
                            const sign = raw >= 0 ? '+' : '';
                            html += `${labels[i]}: ${sign}${raw}<br/>`;
                        }
                        return html;
                    }
                },
                radar: {
                    indicator: [
                        { name: '📚 作业', max: 100 },
                        { name: '🧹 卫生', max: 100 },
                        { name: '📏 纪律', max: 100 },
                        { name: '⚽ 体育', max: 100 },
                        { name: '🌟 文明', max: 100 },
                        { name: '📋 其他', max: 100 }
                    ],
                    shape: 'polygon',
                    splitNumber: 4,
                    axisName: {
                        color: '#666',
                        fontSize: 12
                    },
                    splitLine: {
                        lineStyle: { color: '#e8e8e8' }
                    },
                    splitArea: {
                        show: true,
                        areaStyle: {
                            color: ['#fff', '#f8fff8']
                        }
                    },
                    axisLine: {
                        lineStyle: { color: '#e8e8e8' }
                    }
                },
                series: [{
                    type: 'radar',
                    data: [{
                        value: radarVals,
                        name: '我的表现',
                        areaStyle: {
                            color: 'rgba(67, 233, 123, 0.3)'
                        },
                        lineStyle: {
                            color: '#43e97b',
                            width: 2
                        },
                        itemStyle: {
                            color: '#43e97b'
                        }
                    }]
                }]
            };
            
            radarChart.setOption(option);
        }
        
        async function loadRecords() {
            const res = await fetch(`/api/student/records?name=${encodeURIComponent(userName)}`);
            const data = await res.json();
            
            const tbody = document.getElementById('recordsBody');
            const emptyState = document.getElementById('emptyRecords');
            
            if (!data.records || data.records.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            const emojiMap = {
                '作业': '📚', '卫生': '🧹', '纪律': '📏',
                '体育锻炼': '⚽', '文明行为': '🌟', '其他': '📋'
            };
            
            tbody.innerHTML = data.records.slice(0, 10).map(r => `
                <tr>
                    <td>${r.date || '-'}</td>
                    <td><span class="category-tag">${emojiMap[r.category] || '📋'} ${r.category || '-'}</span></td>
                    <td>${r.rule || r.remark || '-'}</td>
                    <td class="${r.score >= 0 ? 'score-positive' : 'score-negative'}">
                        ${r.score >= 0 ? '+' : ''}${r.score}
                    </td>
                    <td>${r.recorder || '-'}</td>
                </tr>
            `).join('');
        }
        
        async function loadTrend() {
            const res = await fetch(`/api/teacher/student-detail?name=${encodeURIComponent(userName)}`);
            const data = await res.json();
            
            if (!data.trend || data.trend.length === 0) return;
            
            if (!trendChart) {
                trendChart = echarts.init(document.getElementById('trendChart'));
            }
            
            const option = {
                tooltip: {
                    trigger: 'axis',
                    formatter: function(params) {
                        const p = params[0];
                        return `${p.name}<br/>当日: ${p.value}<br/>累计: ${data.trend[p.dataIndex]?.cumulative || 0}`;
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    top: '10%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: data.trend.map(t => t.date),
                    axisLabel: {
                        fontSize: 11,
                        color: '#666'
                    }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        fontSize: 11,
                        color: '#666'
                    }
                },
                series: [{
                    type: 'line',
                    smooth: true,
                    data: data.trend.map(t => t.score),
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(67, 233, 123, 0.5)' },
                            { offset: 1, color: 'rgba(67, 233, 123, 0.05)' }
                        ])
                    },
                    lineStyle: {
                        color: '#43e97b',
                        width: 3
                    },
                    itemStyle: {
                        color: '#43e97b'
                    },
                    symbol: 'circle',
                    symbolSize: 6
                }]
            };
            
            trendChart.setOption(option);
        }
        
        async function submitReport() {
            const category = document.getElementById('reportCategory').value;
            const score = parseFloat(document.getElementById('reportScore').value);
            const description = document.getElementById('reportDesc').value.trim();
            
            if (!description) {
                alert('请填写事迹描述');
                return;
            }
            
            if (isNaN(score) || score === 0) {
                alert('请输入有效的分值');
                return;
            }
            
            const res = await fetch('/api/student/report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    reporter: userName,
                    category: category,
                    description: description,
                    score: score
                })
            });
            
            const data = await res.json();
            
            if (data.success) {
                alert('✅ ' + data.message);
                document.getElementById('reportDesc').value = '';
                document.getElementById('reportScore').value = '';
            } else {
                alert('❌ ' + (data.message || '提交失败'));
            }
        }
        
        // 初始化
        if (checkAuth()) {
            loadData();
            
            // 窗口调整时重绘图表
            window.addEventListener('resize', () => {
                if (radarChart) radarChart.resize();
                if (trendChart) trendChart.resize();
            });
        }
    </script>
</body>
</html>
