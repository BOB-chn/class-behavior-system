<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>704班行为管理系统 - 登录</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        .login-container {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo-area {
            text-align: center;
            margin-bottom: 36px;
        }
        
        .logo-emoji {
            font-size: 64px;
            margin-bottom: 12px;
        }
        
        .logo-title {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .logo-subtitle {
            font-size: 14px;
            color: #888;
            margin-top: 8px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin-bottom: 10px;
        }
        
        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 20px;
            font-size: 16px;
            border: 2px solid #e8e8e8;
            border-radius: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .form-input::placeholder {
            color: #bbb;
        }
        
        .role-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }
        
        .role-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .role-btn:hover {
            border-color: #667eea;
        }
        
        .role-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }
        
        .role-btn .emoji {
            font-size: 24px;
            display: block;
            margin-bottom: 6px;
        }
        
        .role-btn .text {
            font-size: 13px;
            color: #666;
        }
        
        .login-btn {
            width: 100%;
            height: 54px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .demo-hint {
            text-align: center;
            margin-top: 24px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        
        .demo-hint .title {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .demo-hint .accounts {
            font-size: 12px;
            color: #888;
            line-height: 1.8;
        }
        
        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        
        .loading {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-area">
            <div class="logo-emoji">📚</div>
            <div class="logo-title">704班行为管理系统</div>
            <div class="logo-subtitle">记录成长 · 见证进步</div>
        </div>
        
        <div class="role-selector">
            <div class="role-btn active" data-role="student" onclick="selectRole('student')">
                <span class="emoji">👨‍🎓</span>
                <span class="text">学生</span>
            </div>
            <div class="role-btn" data-role="monitor" onclick="selectRole('monitor')">
                <span class="emoji">👮</span>
                <span class="text">值日班长</span>
            </div>
            <div class="role-btn" data-role="teacher" onclick="selectRole('teacher')">
                <span class="emoji">👩‍🏫</span>
                <span class="text">教师</span>
            </div>
        </div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">账号</label>
                <input type="text" class="form-input" id="username" placeholder="请输入账号" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" id="password" placeholder="请输入密码" autocomplete="off">
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">登 录</button>
            
            <div class="error-msg" id="errorMsg"></div>
        </form>
        
        <div class="demo-hint">
            <div class="title">💡 演示账号</div>
            <div class="accounts">
                学生：学号（如2026001）密码：123<br>
                值日班长：zrbz1/zrbz2/zrbz3 密码：123<br>
                教师：jiaoshi 或 qishuang 密码：123
            </div>
        </div>
    </div>
    
    <script>
        let selectedRole = 'student';
        
        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.role === role) {
                    btn.classList.add('active');
                }
            });
            
            // 清空输入
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            
            // 自动聚焦
            document.getElementById('username').focus();
        }
        
        function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');
            
            if (!username || !password) {
                errorMsg.textContent = '请输入账号和密码';
                errorMsg.style.display = 'block';
                return;
            }
            
            errorMsg.style.display = 'none';
            loginBtn.innerHTML = '<span class="loading">⏳</span> 登录中...';
            loginBtn.disabled = true;
            
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    sessionStorage.setItem('userRole', data.role);
                    sessionStorage.setItem('userName', data.name);
                    
                    if (data.role === 'student') {
                        window.location.href = '/student.html';
                    } else if (data.role === 'monitor') {
                        window.location.href = '/monitor.html';
                    } else {
                        window.location.href = '/teacher.html';
                    }
                } else {
                    errorMsg.textContent = data.message || '账号或密码错误';
                    errorMsg.style.display = 'block';
                    loginBtn.innerHTML = '登 录';
                    loginBtn.disabled = false;
                }
            })
            .catch(err => {
                errorMsg.textContent = '网络错误，请稍后重试';
                errorMsg.style.display = 'block';
                loginBtn.innerHTML = '登 录';
                loginBtn.disabled = false;
            });
        }
        
        // 回车登录
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleLogin(e);
            }
        });
    </script>
</body>
</html>
