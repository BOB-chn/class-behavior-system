<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>704班级行为管理系统 - 登录</title>
    <style>
        /* 704班级行为管理系统 - 公共样式 */
        :root {
            --primary-color: #1890ff;
            --primary-hover: #40a9ff;
            --success-color: #52c41a;
            --warning-color: #faad14;
            --danger-color: #ff4d4f;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e8e8e8;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: var(--bg-color); color: var(--text-primary); line-height: 1.6; }
        .navbar { background: linear-gradient(135deg, var(--primary-color), #096dd9); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; }
        .navbar-brand { font-size: 20px; font-weight: 600; }
        .navbar-info { display: flex; align-items: center; gap: 15px; }
        .navbar-info .user-name { font-weight: 500; }
        .navbar-info .role-badge { background: rgba(255, 255, 255, 0.2); padding: 4px 12px; border-radius: 12px; font-size: 12px; }
        .btn-logout { background: rgba(255, 255, 255, 0.2); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.3s; }
        .btn-logout:hover { background: rgba(255, 255, 255, 0.3); }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .card { background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; }
        .card-title { font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--primary-color); }
        .tabs { display: flex; background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 15px 20px; background: transparent; border: none; cursor: pointer; font-size: 15px; color: var(--text-secondary); transition: all 0.3s; border-bottom: 3px solid transparent; }
        .tab-btn:hover { color: var(--primary-color); background: rgba(24, 144, 255, 0.05); }
        .tab-btn.active { color: var(--primary-color); border-bottom-color: var(--primary-color); background: rgba(24, 144, 255, 0.08); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: #fafafa; font-weight: 600; color: var(--text-primary); }
        tr:hover { background: #f5f5f5; }
        .highlight-row { background: rgba(24, 144, 255, 0.1) !important; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; color: var(--text-primary); }
        .form-group label .required { color: var(--danger-color); }
        input[type="text"], input[type="number"], input[type="date"], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; transition: border-color 0.3s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.1); }
        textarea { resize: vertical; min-height: 80px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.3s; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success-color); color: white; }
        .btn-success:hover { background: #73d13d; }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn-danger:hover { background: #ff7875; }
        .btn-secondary { background: #999; color: white; }
        .btn-secondary:hover { background: #777; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .metric-card { background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; text-align: center; }
        .metric-value { font-size: 36px; font-weight: 700; color: var(--primary-color); }
        .metric-label { font-size: 14px; color: var(--text-secondary); margin-top: 5px; }
        .chart-container { width: 100%; height: 400px; }
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .login-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); width: 100%; max-width: 400px; }
        .login-title { text-align: center; font-size: 28px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
        .login-subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 30px; }
        .login-box .btn { width: 100%; padding: 12px; font-size: 16px; margin-top: 10px; }
        .alert { padding: 12px 15px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; }
        .alert-success { background: rgba(82, 196, 26, 0.1); color: var(--success-color); border: 1px solid var(--success-color); }
        .alert-error { background: rgba(255, 77, 79, 0.1); color: var(--danger-color); border: 1px solid var(--danger-color); }
        .alert-warning { background: rgba(250, 173, 20, 0.1); color: var(--warning-color); border: 1px solid var(--warning-color); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 20px; font-weight: 600; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-secondary); }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .status-normal { color: var(--success-color); font-weight: 500; }
        .status-warning { color: var(--warning-color); font-weight: 500; }
        .status-danger { color: var(--danger-color); font-weight: 500; }
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid var(--border-color); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state-icon { font-size: 48px; margin-bottom: 15px; }
        @media (max-width: 768px) { .navbar { flex-direction: column; gap: 10px; } .tabs { flex-wrap: wrap; } .tab-btn { flex: none; width: 50%; } .metrics-grid { grid-template-columns: repeat(2, 1fr); } .chart-container { height: 300px; } }
        @media (max-width: 480px) { .container { padding: 10px; } .card { padding: 15px; } .metric-value { font-size: 28px; } .login-box { padding: 30px 20px; margin: 20px; } }
        .action-buttons { display: flex; gap: 8px; }
        .action-buttons .btn { padding: 6px 12px; font-size: 13px; }
        .rank { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; font-weight: 600; font-size: 14px; }
        .rank-1 { background: #ffd700; color: #8b6914; }
        .rank-2 { background: #c0c0c0; color: #666; }
        .rank-3 { background: #cd7f32; color: #fff; }
        .detail-row { display: none; background: #f9f9f9; }
        .detail-row.active { display: table-row; }
        /* login.html 额外样式 */
        .error-msg { color: var(--danger-color); font-size: 13px; margin-top: 5px; display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">704班级行为管理系统</h1>
            <p class="login-subtitle">Class Behavior Management System</p>
            
            <div class="form-group">
                <label for="account">账号</label>
                <input type="text" id="account" placeholder="请输入账号" autocomplete="username">
                <div class="error-msg" id="account-error"></div>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
                <div class="error-msg" id="password-error"></div>
            </div>
            
            <div class="alert alert-error" id="login-error" style="display: none;"></div>
            
            <button class="btn btn-primary" id="login-btn" onclick="handleLogin()">登 录</button>
        </div>
    </div>

            {account:"2026017",password:"123",role:"student",name:"王以太",studentId:"2026017"},

            // 值日班长
            {account:"zrbz1",password:"123",role:"monitor",name:"值日班长1"},
            {account:"zrbz2",password:"123",role:"monitor",name:"值日班长2"},
            {account:"zrbz3",password:"123",role:"monitor",name:"值日班长3"},
            // 教师
            {account:"jiaoshi",password:"123",role:"teacher",name:"教师"},
            {account:"qishuang",password:"123",role:"teacher",name:"祁爽"},
        ];

        // 检查是否已登录
        function checkLogin() {
            const userInfo = localStorage.getItem('userInfo');
            if (userInfo) {
                const user = JSON.parse(userInfo);
                redirectByRole(user.role);
            }
        }

        // 根据角色跳转
        function redirectByRole(role) {
            switch(role) {
                case 'student':
                    window.location.href = '/student.html';
                    break;
                case 'monitor':
                    window.location.href = '/monitor.html';
                    break;
                case 'teacher':
                    window.location.href = '/teacher.html';
                    break;
                default:
                    break;
            }
        }

        // 处理登录
        function handleLogin() {
            const account = document.getElementById('account').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            
            // 清除之前的错误
            errorDiv.style.display = 'none';
            document.querySelectorAll('.error-msg').forEach(el => {
                el.style.display = 'none';
                el.textContent = '';
            });

            // 验证输入
            if (!account) {
                showError('account-error', '请输入账号');
                return;
            }
            if (!password) {
                showError('password-error', '请输入密码');
                return;
            }

            // 查找账号
            const user = accounts.find(acc => acc.account === account && acc.password === password);
            
            if (!user) {
                errorDiv.textContent = '账号或密码错误，请重试';
                errorDiv.style.display = 'block';
                return;
            }

            // 登录成功，保存信息并跳转
            const userInfo = {
                account: user.account,
                name: user.name,
                role: user.role,
                studentId: user.studentId || null
            };
            localStorage.setItem('userInfo', JSON.stringify(userInfo));
            
            redirectByRole(user.role);
        }

        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.style.display = 'block';
        }

        // 回车登录
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });

        // 页面加载时检查登录状态
        checkLogin();
    </script>
</body>
</html>
