<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>704班行为管理系统 - 登录</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        .login-container {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo-area {
            text-align: center;
            margin-bottom: 36px;
        }
        
        .logo-emoji {
            font-size: 64px;
            margin-bottom: 12px;
        }
        
        .logo-title {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .logo-subtitle {
            font-size: 14px;
            color: #888;
            margin-top: 8px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin-bottom: 10px;
        }
        
        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 20px;
            font-size: 16px;
            border: 2px solid #e8e8e8;
            border-radius: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .form-input::placeholder {
            color: #bbb;
        }
        
        .role-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }
        
        .role-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .role-btn:hover {
            border-color: #667eea;
        }
        
        .role-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }
        
        .role-btn .emoji {
            font-size: 24px;
            display: block;
            margin-bottom: 6px;
        }
        
        .role-btn .text {
            font-size: 13px;
            color: #666;
        }
        
        .login-btn {
            width: 100%;
            height: 54px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .demo-hint {
            text-align: center;
            margin-top: 24px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        
        .demo-hint .title {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .demo-hint .accounts {
            font-size: 12px;
            color: #888;
            line-height: 1.8;
        }
        
        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        
        .loading {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-area">
            <div class="logo-emoji">📚</div>
            <div class="logo-title">704班行为管理系统</div>
            <div class="logo-subtitle">记录成长 · 见证进步</div>
        </div>
        
        <div class="role-selector">
            <div class="role-btn active" data-role="student" onclick="selectRole('student')">
                <span class="emoji">👨‍🎓</span>
                <span class="text">学生</span>
            </div>
            <div class="role-btn" data-role="monitor" onclick="selectRole('monitor')">
                <span class="emoji">👮</span>
                <span class="text">值日班长</span>
            </div>
            <div class="role-btn" data-role="teacher" onclick="selectRole('teacher')">
                <span class="emoji">👩‍🏫</span>
                <span class="text">教师</span>
            </div>
        </div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">账号</label>
                <input type="text" class="form-input" id="username" placeholder="请输入账号" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" id="password" placeholder="请输入密码" autocomplete="off">
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">登 录</button>
            
            <div class="error-msg" id="errorMsg"></div>
        </form>
        
        <div class="demo-hint">
            <div class="title">💡 演示账号</div>
            <div class="accounts">
                学生：学号（如2026001）密码：123<br>
                值日班长：zrbz1/zrbz2/zrbz3 密码：123<br>
                教师：jiaoshi 或 qishuang 密码：123
            </div>
        </div>
    </div>
    
    <script>
        let selectedRole = 'student';
        
        // 硬编码账号列表（确保登录始终可用）
        const ACCOUNTS = [
            {account:'2026001',password:'123',role:'student',name:'蒋雨函'},{account:'2026002',password:'123',role:'student',name:'张钰晴'},{account:'2026003',password:'123',role:'student',name:'李宇航'},{account:'2026004',password:'123',role:'student',name:'姚明哲'},{account:'2026005',password:'123',role:'student',name:'蔡悦然'},{account:'2026006',password:'123',role:'student',name:'沈逸宸'},{account:'2026007',password:'123',role:'student',name:'魏锦宸'},{account:'2026008',password:'123',role:'student',name:'汪雨萱'},{account:'2026009',password:'123',role:'student',name:'丁以萍'},{account:'2026010',password:'123',role:'student',name:'周韩涵'},{account:'2026011',password:'123',role:'student',name:'周陆云逸'},{account:'2026012',password:'123',role:'student',name:'郑宇涵'},{account:'2026013',password:'123',role:'student',name:'徐佐怡'},{account:'2026014',password:'123',role:'student',name:'汤舒婷'},{account:'2026015',password:'123',role:'student',name:'徐梦漪'},{account:'2026016',password:'123',role:'student',name:'张艺通'},{account:'2026017',password:'123',role:'student',name:'王以太'},{account:'2026018',password:'123',role:'student',name:'吴宇浩'},{account:'2026019',password:'123',role:'student',name:'孙泽洋'},{account:'2026020',password:'123',role:'student',name:'李成'},{account:'2026021',password:'123',role:'student',name:'金恒仲'},{account:'2026022',password:'123',role:'student',name:'黄佳丞'},{account:'2026023',password:'123',role:'student',name:'傅雨辰'},{account:'2026024',password:'123',role:'student',name:'陈威吉'},{account:'2026025',password:'123',role:'student',name:'仇彦媛'},{account:'2026026',password:'123',role:'student',name:'柴逸山'},{account:'2026027',password:'123',role:'student',name:'沈毅赐'},{account:'2026028',password:'123',role:'student',name:'熊启航'},{account:'2026029',password:'123',role:'student',name:'韩宇程'},{account:'2026030',password:'123',role:'student',name:'邵晗'},{account:'2026031',password:'123',role:'student',name:'齐慧妍'},{account:'2026032',password:'123',role:'student',name:'章毅煊'},{account:'2026033',password:'123',role:'student',name:'楼智宸'},{account:'2026034',password:'123',role:'student',name:'沈子欣'},{account:'2026035',password:'123',role:'student',name:'厉胡瑾'},{account:'2026036',password:'123',role:'student',name:'邓永琪'},{account:'2026037',password:'123',role:'student',name:'钱奕辰'},{account:'2026038',password:'123',role:'student',name:'阮镱芠'},{account:'2026039',password:'123',role:'student',name:'王胡彬'},
            {account:'zrbz1',password:'123',role:'monitor',name:'值日班长1'},{account:'zrbz2',password:'123',role:'monitor',name:'值日班长2'},{account:'zrbz3',password:'123',role:'monitor',name:'值日班长3'},
            {account:'jiaoshi',password:'123',role:'teacher',name:'教师'},{account:'qishuang',password:'123',role:'teacher',name:'祁爽'},
        ];
        
        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.role === role) {
                    btn.classList.add('active');
                }
            });
            
            // 清空输入
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            
            // 自动聚焦
            document.getElementById('username').focus();
        }
        
        function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');
            
            if (!username || !password) {
                errorMsg.textContent = '请输入账号和密码';
                errorMsg.style.display = 'block';
                return;
            }
            
            errorMsg.style.display = 'none';
            loginBtn.innerHTML = '<span class="loading">⏳</span> 登录中...';
            loginBtn.disabled = true;
            
            // 优先前端匹配账号（确保登录始终可用）
            let matched = ACCOUNTS.find(a => a.account === username && a.password === password && (selectedRole === 'student' || a.role === selectedRole));
            if (matched) {
                sessionStorage.setItem('userRole', matched.role);
                sessionStorage.setItem('userName', matched.name);
                sessionStorage.setItem('userAccount', matched.account);
                // 登录成功后先刷新缓存，确保数据最新
                fetch('/api/refresh').then(() => {
                    if (matched.role === 'student') window.location.href = '/student.html';
                    else if (matched.role === 'monitor') window.location.href = '/monitor.html';
                    else window.location.href = '/teacher.html';
                }).catch(() => {
                    // 即使刷新失败也跳转
                    if (matched.role === 'student') window.location.href = '/student.html';
                    else if (matched.role === 'monitor') window.location.href = '/monitor.html';
                    else window.location.href = '/teacher.html';
                });
                return;
            }
            
            // 前端未匹配，尝试后端验证
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    sessionStorage.setItem('userRole', data.role);
                    sessionStorage.setItem('userName', data.name);
                    // 登录成功后先刷新缓存
                    fetch('/api/refresh').then(() => {
                        if (data.role === 'student') window.location.href = '/student.html';
                        else if (data.role === 'monitor') window.location.href = '/monitor.html';
                        else window.location.href = '/teacher.html';
                    }).catch(() => {
                        if (data.role === 'student') window.location.href = '/student.html';
                        else if (data.role === 'monitor') window.location.href = '/monitor.html';
                        else window.location.href = '/teacher.html';
                    });
                } else {
                    errorMsg.textContent = data.message || '账号或密码错误';
                    errorMsg.style.display = 'block';
                    loginBtn.innerHTML = '登 录';
                    loginBtn.disabled = false;
                }
            })
            .catch(err => {
                errorMsg.textContent = '网络错误，请稍后重试';
                errorMsg.style.display = 'block';
                loginBtn.innerHTML = '登 录';
                loginBtn.disabled = false;
            });
        }
        
        // 回车登录
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleLogin(e);
            }
        });
    </script>
</body>
</html>
