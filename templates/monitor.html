<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>值日班长端 - 704班级行为管理系统</title>
    <style>
        /* 704班级行为管理系统 - 公共样式 */
        :root {
            --primary-color: #1890ff;
            --primary-hover: #40a9ff;
            --success-color: #52c41a;
            --warning-color: #faad14;
            --danger-color: #ff4d4f;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e8e8e8;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: var(--bg-color); color: var(--text-primary); line-height: 1.6; }
        .navbar { background: linear-gradient(135deg, var(--primary-color), #096dd9); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; }
        .navbar-brand { font-size: 20px; font-weight: 600; }
        .navbar-info { display: flex; align-items: center; gap: 15px; }
        .navbar-info .user-name { font-weight: 500; }
        .navbar-info .role-badge { background: rgba(255, 255, 255, 0.2); padding: 4px 12px; border-radius: 12px; font-size: 12px; }
        .btn-logout { background: rgba(255, 255, 255, 0.2); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.3s; }
        .btn-logout:hover { background: rgba(255, 255, 255, 0.3); }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .card { background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; }
        .card-title { font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--primary-color); }
        .tabs { display: flex; background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 15px 20px; background: transparent; border: none; cursor: pointer; font-size: 15px; color: var(--text-secondary); transition: all 0.3s; border-bottom: 3px solid transparent; }
        .tab-btn:hover { color: var(--primary-color); background: rgba(24, 144, 255, 0.05); }
        .tab-btn.active { color: var(--primary-color); border-bottom-color: var(--primary-color); background: rgba(24, 144, 255, 0.08); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: #fafafa; font-weight: 600; color: var(--text-primary); }
        tr:hover { background: #f5f5f5; }
        .highlight-row { background: rgba(24, 144, 255, 0.1) !important; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; color: var(--text-primary); }
        .form-group label .required { color: var(--danger-color); }
        input[type="text"], input[type="number"], input[type="date"], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; transition: border-color 0.3s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.1); }
        textarea { resize: vertical; min-height: 80px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.3s; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success-color); color: white; }
        .btn-success:hover { background: #73d13d; }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn-danger:hover { background: #ff7875; }
        .btn-secondary { background: #999; color: white; }
        .btn-secondary:hover { background: #777; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .metric-card { background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; text-align: center; }
        .metric-value { font-size: 36px; font-weight: 700; color: var(--primary-color); }
        .metric-label { font-size: 14px; color: var(--text-secondary); margin-top: 5px; }
        .chart-container { width: 100%; height: 400px; }
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .login-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); width: 100%; max-width: 400px; }
        .login-title { text-align: center; font-size: 28px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
        .login-subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 30px; }
        .login-box .btn { width: 100%; padding: 12px; font-size: 16px; margin-top: 10px; }
        .alert { padding: 12px 15px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; }
        .alert-success { background: rgba(82, 196, 26, 0.1); color: var(--success-color); border: 1px solid var(--success-color); }
        .alert-error { background: rgba(255, 77, 79, 0.1); color: var(--danger-color); border: 1px solid var(--danger-color); }
        .alert-warning { background: rgba(250, 173, 20, 0.1); color: var(--warning-color); border: 1px solid var(--warning-color); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 20px; font-weight: 600; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-secondary); }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .status-normal { color: var(--success-color); font-weight: 500; }
        .status-warning { color: var(--warning-color); font-weight: 500; }
        .status-danger { color: var(--danger-color); font-weight: 500; }
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid var(--border-color); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state-icon { font-size: 48px; margin-bottom: 15px; }
        @media (max-width: 768px) { .navbar { flex-direction: column; gap: 10px; } .tabs { flex-wrap: wrap; } .tab-btn { flex: none; width: 50%; } .metrics-grid { grid-template-columns: repeat(2, 1fr); } .chart-container { height: 300px; } }
        @media (max-width: 480px) { .container { padding: 10px; } .card { padding: 15px; } .metric-value { font-size: 28px; } .login-box { padding: 30px 20px; margin: 20px; } }
        .action-buttons { display: flex; gap: 8px; }
        .action-buttons .btn { padding: 6px 12px; font-size: 13px; }
        .rank { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; font-weight: 600; font-size: 14px; }
        .rank-1 { background: #ffd700; color: #8b6914; }
        .rank-2 { background: #c0c0c0; color: #666; }
        .rank-3 { background: #cd7f32; color: #fff; }
        .detail-row { display: none; background: #f9f9f9; }
        .detail-row.active { display: table-row; }
        /* monitor.html 额外样式 */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .form-grid .form-group { margin-bottom: 0; }
        .report-card { background: #f9f9f9; border-left: 4px solid var(--primary-color); padding: 15px; margin-bottom: 15px; border-radius: 0 8px 8px 0; }
        .report-card:hover { background: #f0f0f0; }
        .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .report-student { font-weight: 600; color: var(--text-primary); font-size: 16px; }
        .report-date { color: #999; font-size: 13px; }
        .report-body { margin-bottom: 10px; }
        .report-category { display: inline-block; padding: 3px 12px; border-radius: 12px; background: #e6f7ff; color: #1890ff; font-size: 13px; margin-right: 10px; }
        .report-desc { color: var(--text-secondary); font-size: 14px; margin-top: 5px; }
        .report-actions { display: flex; gap: 10px; align-items: center; }
        .score-input { width: 80px !important; display: inline-block; }
        .pending-count { background: var(--danger-color); color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-left: 5px; }
        .empty-pending { text-align: center; padding: 60px; color: var(--text-secondary); }
        .empty-pending-icon { font-size: 64px; margin-bottom: 15px; }
        .history-item { padding: 12px; border-bottom: 1px solid var(--border-color); }
        .history-item:last-child { border-bottom: none; }
        .history-date { font-weight: 600; color: var(--primary-color); }
        .history-student { margin: 5px 0; }
        .history-meta { font-size: 13px; color: #999; }
        .category-badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .badge-作业 { background: #e6f7ff; color: #1890ff; }
        .badge-卫生 { background: #f6ffed; color: #52c41a; }
        .badge-纪律 { background: #fff7e6; color: #fa8c16; }
        .badge-体育锻炼 { background: #fff1f0; color: #ff4d4f; }
        .badge-文明行为 { background: #f9f0ff; color: #722ed1; }
        .badge-其他 { background: #f5f5f5; color: #666; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">704班级行为管理系统</div>
        <div class="navbar-info">
            <span class="user-name" id="userName">加载中...</span>
            <span class="role-badge">值日班长</span>
            <button class="btn-logout" onclick="logout()">退出</button>
        </div>
    </nav>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn" onclick="switchTab('approve')">
                审核学生上报
                <span class="pending-count" id="pendingCount" style="display: none;">0</span>
            </button>
            <button class="tab-btn active" onclick="switchTab('record')">行为记录录入</button>
            <button class="tab-btn" onclick="switchTab('handover')">值日交接</button>
            <button class="tab-btn" onclick="switchTab('history')">最近记录</button>
        </div>

        <!-- Tab1: 审核学生上报 -->
        <div id="approve" class="tab-content">
            <div class="card">
                <h3 class="card-title">待审核上报 <span class="pending-count" id="pendingCount2" style="display: none;">0</span></h3>
                <div id="pendingLoading" class="loading"><div class="spinner"></div><p>加载中...</p></div>
                <div id="pendingList"></div>
                <div class="empty-pending" id="pendingEmpty" style="display: none;">
                    <div class="empty-pending-icon">✅</div>
                    <p style="font-size: 18px;">暂无待审核的上报</p>
                    <p style="font-size: 14px; margin-top: 10px;">太棒了！所有上报都已处理完毕</p>
                </div>
            </div>
        </div>

        <!-- Tab2: 行为记录录入 -->
        <div id="record" class="tab-content active">
            <div class="card">
                <h3 class="card-title">录入行为记录</h3>
                <form id="recordForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>日期 <span class="required">*</span></label>
                            <input type="date" id="recordDate" required>
                        </div>
                        <div class="form-group">
                            <label>学生姓名 <span class="required">*</span></label>
                            <select id="studentSelect" required></select>
                        </div>
                        <div class="form-group">
                            <label>行为类别 <span class="required">*</span></label>
                            <select id="categorySelect" required>
                                <option value="">请选择</option>
                                <option value="作业">作业</option>
                                <option value="卫生">卫生</option>
                                <option value="纪律">纪律</option>
                                <option value="体育锻炼">体育锻炼</option>
                                <option value="文明行为">文明行为</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>分值 <span class="required">*</span></label>
                            <input type="number" id="scoreInput" placeholder="加分正数，扣分负数" required>
                        </div>
                    </div>
                    <div class="form-group" style="margin-top: 15px;">
                        <label>班规条款</label>
                        <input type="text" id="ruleClause" placeholder="如：迟到、早退、作业未交等">
                    </div>
                    <div class="form-group">
                        <label>备注</label>
                        <textarea id="noteInput" placeholder="补充说明（选填）"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">提交记录</button>
                </form>
            </div>
        </div>

        <!-- Tab3: 值日交接 -->
        <div id="handover" class="tab-content">
            <div class="card">
                <h3 class="card-title">值日交接</h3>
                <form id="handoverForm">
                    <div class="form-group">
                        <label>日期 <span class="required">*</span></label>
                        <input type="date" id="handoverDate" required>
                    </div>
                    <div class="form-group">
                        <label>值日总结 <span class="required">*</span></label>
                        <textarea id="summaryInput" placeholder="今天班级整体情况总结..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>未处理事项</label>
                        <textarea id="pendingInput" placeholder="需要下一位值日班长跟进的事项..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>交接备注</label>
                        <textarea id="remarkInput" placeholder="其他需要说明的情况..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">提交交接</button>
                </form>
            </div>
        </div>

        <!-- Tab4: 最近记录 -->
        <div id="history" class="tab-content">
            <div class="card">
                <h3 class="card-title">最近行为记录</h3>
                <div id="historyLoading" class="loading"><div class="spinner"></div><p>加载中...</p></div>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

    <!-- 审核通过弹窗 -->
    <div class="modal" id="approveModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">审核通过 - 填写分值</h3>
                <button class="modal-close" onclick="closeApproveModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p id="approveStudent" style="font-weight: 600; margin-bottom: 10px;"></p>
                <p id="approveDesc" style="color: #666; font-size: 14px; margin-bottom: 15px;"></p>
                <div class="form-group">
                    <label>加分分值 <span class="required">*</span></label>
                    <input type="number" id="approveScore" placeholder="请输入加分分值（正数）" min="1">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeApproveModal()">取消</button>
                <button class="btn btn-success" onclick="confirmApprove()">确认通过</button>
            </div>
        </div>
    </div>

    <div class="modal" id="alertModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="alertTitle">提示</h3>
                <button class="modal-close" onclick="closeAlert()">&times;</button>
            </div>
            <div class="modal-body"><p id="alertMessage"></p></div>
            <div class="modal-footer"><button class="btn btn-primary" onclick="closeAlert()">确定</button></div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let pendingReports = [];
        let currentApproveReport = null;
        const studentNames = [
            "蒋雨函","张钰晴","李宇航","姚明哲","蔡悦然","沈逸宸","魏锦宸","汪雨萱","丁以萍","周韩涵",
            "周陆云逸","郑宇涵","徐佐怡","汤舒婷","徐梦漪","张艺通","王以太","吴宇浩","孙泽洋","李成",
            "金恒仲","黄佳丞","傅雨辰","陈威吉","仇彦媛","柴逸山","沈毅赐","熊启航","韩宇程","邵晗",
            "齐慧妍","章毅煊","楼智宸","沈子欣","厉胡瑾","邓永琪","钱奕辰","阮镱芠","王胡彬"
        ];

        function init() {
            const userInfo = localStorage.getItem('userInfo');
            if (!userInfo) { window.location.href = '/login.html'; return; }
            currentUser = JSON.parse(userInfo);
            if (currentUser.role !== 'monitor') { window.location.href = '/login.html'; return; }
            document.getElementById('userName').textContent = currentUser.name;
            document.getElementById('recordDate').valueAsDate = new Date();
            document.getElementById('handoverDate').valueAsDate = new Date();
            populateStudentSelect();
        }

        function populateStudentSelect() {
            const select = document.getElementById('studentSelect');
            select.innerHTML = '<option value="">请选择学生</option>' + 
                studentNames.map(name => `<option value="${name}">${name}</option>`).join('');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.tab-btn').classList.add('active');
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (tabId === 'approve') loadPendingReports();
            else if (tabId === 'history') loadRecentRecords();
        }

        async function loadPendingReports() {
            document.getElementById('pendingLoading').style.display = 'block';
            document.getElementById('pendingList').innerHTML = '';
            document.getElementById('pendingEmpty').style.display = 'none';
            try {
                const response = await fetch('/api/monitor/pending-reports');
                const data = await response.json();
                document.getElementById('pendingLoading').style.display = 'none';
                if (data.code === 0 || data.success) {
                    pendingReports = data.data || [];
                    renderPendingReports();
                }
            } catch (error) {
                document.getElementById('pendingLoading').style.display = 'none';
                showAlert('错误', '加载失败');
            }
        }

        function renderPendingReports() {
            const count = pendingReports.length;
            const badge1 = document.getElementById('pendingCount');
            const badge2 = document.getElementById('pendingCount2');
            if (count > 0) {
                badge1.textContent = count;
                badge1.style.display = 'inline';
                badge2.textContent = count;
                badge2.style.display = 'inline';
            } else {
                badge1.style.display = 'none';
                badge2.style.display = 'none';
            }
            if (count === 0) {
                document.getElementById('pendingEmpty').style.display = 'block';
                return;
            }
            const list = document.getElementById('pendingList');
            list.innerHTML = pendingReports.map(report => {
                const date = report.date ? new Date(report.date).toLocaleDateString('zh-CN') : '-';
                const catClass = `badge-${report.category || '其他'}`;
                return `<div class="report-card">
                    <div class="report-header">
                        <span class="report-student">${report.studentName || '-'}</span>
                        <span class="report-date">${date}</span>
                    </div>
                    <div class="report-body">
                        <span class="report-category ${catClass}">${report.category || '-'}</span>
                        <p class="report-desc">${report.description || '-'}</p>
                    </div>
                    <div class="report-actions">
                        <input type="number" class="score-input" id="score-${report.recordId}" placeholder="分值" min="1">
                        <button class="btn btn-success btn-sm" onclick="approveReport('${report.recordId}')">通过</button>
                        <button class="btn btn-danger btn-sm" onclick="rejectReport('${report.recordId}')">驳回</button>
                    </div>
                </div>`;
            }).join('');
        }

        async function approveReport(recordId) {
            const scoreInput = document.getElementById(`score-${recordId}`);
            const score = parseInt(scoreInput.value);
            if (!score || score <= 0) {
                showAlert('提示', '请输入有效的加分分值');
                return;
            }
            try {
                const response = await fetch('/api/monitor/approve-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reportRecordId: recordId,
                        score: score,
                        reviewer: currentUser.name
                    })
                });
                const data = await response.json();
                if (data.code === 0 || data.success) {
                    showAlert('成功', '审核已通过！');
                    loadPendingReports();
                } else {
                    showAlert('失败', data.msg || '操作失败');
                }
            } catch (error) { showAlert('错误', '网络错误'); }
        }

        async function rejectReport(recordId) {
            if (!confirm('确定要驳回此上报吗？')) return;
            try {
                const response = await fetch('/api/monitor/reject-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reportRecordId: recordId, reviewer: currentUser.name })
                });
                const data = await response.json();
                if (data.code === 0 || data.success) {
                    showAlert('成功', '已驳回');
                    loadPendingReports();
                } else { showAlert('失败', data.msg || '操作失败'); }
            } catch (error) { showAlert('错误', '网络错误'); }
        }

        // 行为记录表单提交
        document.getElementById('recordForm')?.addEventListener('submit', async function(e) {
            e.preventDefault();
            const date = document.getElementById('recordDate').value;
            const studentName = document.getElementById('studentSelect').value;
            const category = document.getElementById('categorySelect').value;
            const score = parseInt(document.getElementById('scoreInput').value);
            const ruleClause = document.getElementById('ruleClause').value;
            const note = document.getElementById('noteInput').value;
            if (!date || !studentName || !category || isNaN(score)) {
                showAlert('提示', '请填写必填项');
                return;
            }
            try {
                const response = await fetch('/api/monitor/record', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date, studentName, category, score, ruleClause, note, recorder: currentUser.name })
                });
                const data = await response.json();
                if (data.code === 0 || data.success) {
                    showAlert('成功', '行为记录已录入！');
                    document.getElementById('recordForm').reset();
                    document.getElementById('recordDate').valueAsDate = new Date();
                } else { showAlert('失败', data.msg || '录入失败'); }
            } catch (error) { showAlert('错误', '网络错误'); }
        });

        // 值日交接表单提交
        document.getElementById('handoverForm')?.addEventListener('submit', async function(e) {
            e.preventDefault();
            const date = document.getElementById('handoverDate').value;
            const summary = document.getElementById('summaryInput').value;
            const pending = document.getElementById('pendingInput').value;
            const remark = document.getElementById('remarkInput').value;
            if (!date || !summary) { showAlert('提示', '请填写必填项'); return; }
            try {
                const response = await fetch('/api/monitor/handover', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date, summary, pending, remark, recorder: currentUser.name })
                });
                const data = await response.json();
                if (data.code === 0 || data.success) {
                    showAlert('成功', '交接记录已保存！');
                    document.getElementById('handoverForm').reset();
                    document.getElementById('handoverDate').valueAsDate = new Date();
                } else { showAlert('失败', data.msg || '提交失败'); }
            } catch (error) { showAlert('错误', '网络错误'); }
        });

        async function loadRecentRecords() {
            document.getElementById('historyLoading').style.display = 'block';
            document.getElementById('historyList').innerHTML = '';
            try {
                const response = await fetch('/api/monitor/recent-records');
                const data = await response.json();
                document.getElementById('historyLoading').style.display = 'none';
                if (data.code === 0 || data.success) {
                    renderRecentRecords(data.data || []);
                }
            } catch (error) {
                document.getElementById('historyLoading').style.display = 'none';
            }
        }

        function renderRecentRecords(records) {
            if (records.length === 0) {
                document.getElementById('historyList').innerHTML = '<div class="empty-state"><p>暂无记录</p></div>';
                return;
            }
            document.getElementById('historyList').innerHTML = records.map(r => {
                const date = r.date ? new Date(r.date).toLocaleDateString('zh-CN') : '-';
                const catClass = `badge-${r.category || '其他'}`;
                const scoreClass = r.score > 0 ? 'score-positive' : r.score < 0 ? 'score-negative' : '';
                return `<div class="history-item">
                    <div><span class="history-date">${date}</span> <span class="category-badge ${catClass}">${r.category || '-'}</span></div>
                    <div class="history-student"><strong>${r.studentName || '-'}</strong> <span class="${scoreClass}">${r.score > 0 ? '+' : ''}${r.score || 0}</span>分</div>
                    <div class="history-meta">${r.ruleClause || ''} ${r.recorder ? '| 记录人: ' + r.recorder : ''}</div>
                </div>`;
            }).join('');
        }

        function logout() { localStorage.removeItem('userInfo'); window.location.href = '/login.html'; }
        function showAlert(title, message) {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertMessage').textContent = message;
            document.getElementById('alertModal').classList.add('active');
        }
        function closeAlert() { document.getElementById('alertModal').classList.remove('active'); }
        function closeApproveModal() { document.getElementById('approveModal').classList.remove('active'); }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
