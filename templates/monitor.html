<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>值日班长 - 704班行为管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe6e6 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .header {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            padding: 20px 24px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-emoji {
            font-size: 32px;
        }
        
        .header-title {
            font-size: 22px;
            font-weight: bold;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .user-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        
        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
        }
        
        .stat-card.blue {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .stat-card.green {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        
        .stat-card.purple {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .stat-emoji {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 4px;
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 10px 20px;
            border: none;
            background: #f0f0f0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }
        
        .tab:hover:not(.active) {
            background: #e0e0e0;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .report-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .report-item {
            background: #f8f9fa;
            padding: 16px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        
        .report-item:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .report-info {
            flex: 1;
        }
        
        .report-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .report-student {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        
        .report-badge {
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
            background: #fee140;
            color: #333;
        }
        
        .report-desc {
            color: #666;
            font-size: 14px;
            margin-bottom: 6px;
        }
        
        .report-meta {
            font-size: 12px;
            color: #999;
        }
        
        .report-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .btn-approve {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }
        
        .btn-reject {
            background: #f0f0f0;
            color: #666;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .empty-state .emoji {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .refresh-btn {
            background: #f0f0f0;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .refresh-btn:hover {
            background: #e0e0e0;
        }
        
        /* 录入表单 */
        .record-form {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            margin-bottom: 8px;
        }
        
        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        
        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: #fa709a;
        }
        
        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(250, 112, 154, 0.4);
        }
        
        /* 交接表单 */
        .handover-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        /* 排行榜 */
        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            transition: all 0.3s;
        }
        
        .leaderboard-item:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            margin-right: 12px;
        }
        
        .rank-1 {
            background: linear-gradient(135deg, #ffd700 0%, #ffb700 100%);
            color: white;
        }
        
        .rank-2 {
            background: linear-gradient(135deg, #c0c0c0 0%, #a8a8a8 100%);
            color: white;
        }
        
        .rank-3 {
            background: linear-gradient(135deg, #cd7f32 0%, #b8690b 100%);
            color: white;
        }
        
        .rank-other {
            background: #e8e8e8;
            color: #666;
        }
        
        .leaderboard-name {
            flex: 1;
            font-weight: 500;
        }
        
        .leaderboard-score {
            font-weight: bold;
            color: #fa709a;
        }
        
        .leaderboard-status {
            margin-left: 12px;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
        }
        
        .status-normal {
            background: #e8f5e9;
            color: #43a047;
        }
        
        .status-warning {
            background: #fff3e0;
            color: #ff9800;
        }
        
        .status-alert {
            background: #ffebee;
            color: #f44336;
        }
        
        .student-selector {
            position: relative;
        }
        
        .student-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #fa709a;
            border-top: none;
            border-radius: 0 0 12px 12px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 100;
        }
        
        .student-dropdown.show {
            display: block;
        }
        
        .student-option {
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .student-option:hover {
            background: #fff5f5;
        }
        
        .records-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .records-table th,
        .records-table td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        .records-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #666;
            font-size: 13px;
        }
        
        .records-table tr:hover {
            background: #f8f9fa;
        }
        
        .score-positive {
            color: #43e97b;
            font-weight: bold;
        }
        
        .score-negative {
            color: #ff6b6b;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .record-form,
            .handover-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <span class="header-emoji">👮</span>
            <span class="header-title">值日班长端</span>
        </div>
        <div class="header-right">
            <span class="user-info" id="userInfo">👋 你好！</span>
            <button class="refresh-btn" onclick="loadData()">🔄 刷新</button>
            <button class="logout-btn" onclick="logout()">退出</button>
        </div>
    </header>
    
    <div class="container">
        <!-- 统计卡片 -->
        <div class="stats-row">
            <div class="stat-card blue">
                <div class="stat-emoji">📋</div>
                <div class="stat-value" id="pendingCount">0</div>
                <div class="stat-label">待审核上报</div>
            </div>
            <div class="stat-card green">
                <div class="stat-emoji">👥</div>
                <div class="stat-value" id="totalStudents">0</div>
                <div class="stat-label">班级人数</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-emoji">📊</div>
                <div class="stat-value" id="todayRecords">0</div>
                <div class="stat-label">今日记录</div>
            </div>
            <div class="stat-card">
                <div class="stat-emoji">⚠️</div>
                <div class="stat-value" id="warningCount">0</div>
                <div class="stat-label">预警人数</div>
            </div>
        </div>
        
        <!-- 标签页 -->
        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('pending')">📋 待审核</button>
                <button class="tab" onclick="switchTab('record')">✏️ 录入记录</button>
                <button class="tab" onclick="switchTab('handover')">🔄 交接班</button>
                <button class="tab" onclick="switchTab('records')">📝 行为记录</button>
            </div>
            
            <!-- 待审核 -->
            <div class="tab-content active" id="pending">
                <div class="report-list" id="pendingList">
                    <div class="empty-state">
                        <div class="emoji">📭</div>
                        <div>暂无待审核的上报</div>
                    </div>
                </div>
            </div>
            
            <!-- 录入记录 -->
            <div class="tab-content" id="record">
                <form class="record-form" onsubmit="handleRecord(event)">
                    <div class="form-group student-selector">
                        <label class="form-label">学生姓名</label>
                        <input type="text" class="form-input" id="studentName" placeholder="点击选择或输入" autocomplete="off" onfocus="showStudentDropdown()" oninput="filterStudents()">
                        <div class="student-dropdown" id="studentDropdown"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">行为类别</label>
                        <select class="form-select" id="recordCategory">
                            <option value="作业">📚 作业</option>
                            <option value="卫生">🧹 卫生</option>
                            <option value="纪律">📏 纪律</option>
                            <option value="体育锻炼">⚽ 体育锻炼</option>
                            <option value="文明行为">🌟 文明行为</option>
                            <option value="其他">📋 其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">分值（正数加分，负数扣分）</label>
                        <input type="number" class="form-input" id="recordScore" placeholder="例如: 5 或 -5" step="0.5">
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">班规条款/事项描述</label>
                        <input type="text" class="form-input" id="recordRule" placeholder="例如: 课堂积极发言 / 上课说话">
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">备注（可选）</label>
                        <textarea class="form-textarea" id="recordRemark" placeholder="补充说明..."></textarea>
                    </div>
                    <div class="form-group full-width">
                        <button type="submit" class="submit-btn">✏️ 录入记录</button>
                    </div>
                </form>
            </div>
            
            <!-- 交接班 -->
            <div class="tab-content" id="handover">
                <form class="handover-form" onsubmit="handleHandover(event)">
                    <div class="form-group full-width">
                        <label class="form-label">值日总结</label>
                        <textarea class="form-textarea" id="handoverSummary" placeholder="今天班级整体表现如何？有哪些亮点和问题？"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">未处理事项</label>
                        <textarea class="form-textarea" id="handoverPending" placeholder="还有哪些事情需要下一位值日班长跟进？"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">交接备注</label>
                        <textarea class="form-textarea" id="handoverNote" placeholder="给下一位值日班长的温馨提示..."></textarea>
                    </div>
                    <div class="form-group full-width">
                        <button type="submit" class="submit-btn">🔄 提交交接</button>
                    </div>
                </form>
            </div>
            
            <!-- 行为记录 -->
            <div class="tab-content" id="records">
                <table class="records-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>学生</th>
                            <th>类别</th>
                            <th>事项</th>
                            <th>分值</th>
                            <th>记录人</th>
                        </tr>
                    </thead>
                    <tbody id="allRecordsBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        let userName = '';
        let students = [];
        
        // 检查登录状态
        function checkAuth() {
            const role = sessionStorage.getItem('userRole');
            userName = sessionStorage.getItem('userName') || '';
            
            if (!role || role !== 'monitor') {
                window.location.href = '/';
                return false;
            }
            
            document.getElementById('userInfo').textContent = `👋 ${userName}，辛苦了！`;
            return true;
        }
        
        function logout() {
            sessionStorage.clear();
            window.location.href = '/';
        }
        
        // 切换标签
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
        
        // 加载数据
        async function loadData() {
            // 加载待审核列表
            loadPendingReports();
            
            // 加载所有行为记录
            loadAllRecords();
            
            // 获取统计数据
            const healthRes = await fetch('/api/health');
            const health = await healthRes.json();
            
            document.getElementById('totalStudents').textContent = health.students_count || 0;
            
            // 加载预警数
            const warnRes = await fetch('/api/teacher/warnings');
            const warnData = await warnRes.json();
            document.getElementById('warningCount').textContent = warnData.warnings?.length || 0;
        }
        
        async function loadPendingReports() {
            const res = await fetch('/api/monitor/pending-reports');
            const data = await res.json();
            
            document.getElementById('pendingCount').textContent = data.pending?.length || 0;
            
            const list = document.getElementById('pendingList');
            
            if (!data.pending || data.pending.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">🎉</div>
                        <div>太棒了！暂无待审核的上报</div>
                    </div>
                `;
                return;
            }
            
            const emojiMap = {
                '作业': '📚', '卫生': '🧹', '纪律': '📏',
                '体育锻炼': '⚽', '文明行为': '🌟', '其他': '📋'
            };
            
            list.innerHTML = data.pending.map(r => `
                <div class="report-item">
                    <div class="report-info">
                        <div class="report-header">
                            <span class="report-student">${r.reporter}</span>
                            <span class="report-badge">${emojiMap[r.category] || '📋'} ${r.category}</span>
                            <span class="report-badge" style="background: ${r.score > 0 ? '#e8f5e9' : '#ffebee'}; color: ${r.score > 0 ? '#43a047' : '#f44336'}">
                                ${r.score > 0 ? '+' : ''}${r.score}分
                            </span>
                        </div>
                        <div class="report-desc">${r.description || '-'}</div>
                        <div class="report-meta">📅 ${r.date || '-'} · 学生自主上报</div>
                    </div>
                    <div class="report-actions">
                        <button class="btn btn-approve" onclick="approveReport('${r.record_id}')">✅ 通过</button>
                        <button class="btn btn-reject" onclick="rejectReport('${r.record_id}')">❌ 驳回</button>
                    </div>
                </div>
            `).join('');
        }
        
        async function approveReport(recordId) {
            if (!confirm('确认通过此上报吗？将自动创建行为记录并更新积分。')) return;
            
            const res = await fetch('/api/monitor/approve-report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    report_record_id: recordId,
                    reviewer: userName
                })
            });
            
            const data = await res.json();
            alert(data.success ? '✅ ' + data.message : '❌ ' + data.message);
            
            if (data.success) {
                loadData();
            }
        }
        
        async function rejectReport(recordId) {
            if (!confirm('确认驳回此上报吗？')) return;
            
            const res = await fetch('/api/monitor/reject-report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    report_record_id: recordId,
                    reviewer: userName
                })
            });
            
            const data = await res.json();
            alert(data.success ? '✅ 已驳回' : '❌ ' + data.message);
            
            if (data.success) {
                loadData();
            }
        }
        
        async function loadAllRecords() {
            // 获取所有行为记录
            const res = await fetch('/api/student/records?name=');
            // 这个接口需要name参数，我们用其他方式
            
            // 改用排行榜接口获取基本信息，然后前端筛选
            const lbRes = await fetch('/api/leaderboard');
            const lbData = await lbRes.json();
            
            // 获取教师看板获取今日记录数
            const dashRes = await fetch('/api/teacher/dashboard');
            const dashData = await dashRes.json();
            
            if (dashData.stats) {
                document.getElementById('todayRecords').textContent = dashData.stats.today_total_records || 0;
            }
            
            // 加载学生列表供选择
            students = lbData.leaderboard?.map(s => s.name) || [];
            renderStudentDropdown('');
        }
        
        function showStudentDropdown() {
            document.getElementById('studentDropdown').classList.add('show');
        }
        
        function hideStudentDropdown() {
            setTimeout(() => {
                document.getElementById('studentDropdown').classList.remove('show');
            }, 200);
        }
        
        function renderStudentDropdown(filter) {
            const dropdown = document.getElementById('studentDropdown');
            const filtered = students.filter(s => s.includes(filter));
            
            dropdown.innerHTML = filtered.map(s => `
                <div class="student-option" onclick="selectStudent('${s}')">${s}</div>
            `).join('');
        }
        
        function filterStudents() {
            const input = document.getElementById('studentName');
            renderStudentDropdown(input.value);
        }
        
        function selectStudent(name) {
            document.getElementById('studentName').value = name;
            hideStudentDropdown();
        }
        
        async function handleRecord(e) {
            e.preventDefault();
            
            const studentName = document.getElementById('studentName').value.trim();
            const category = document.getElementById('recordCategory').value;
            const score = parseFloat(document.getElementById('recordScore').value);
            const rule = document.getElementById('recordRule').value.trim();
            const remark = document.getElementById('recordRemark').value.trim();
            
            if (!studentName || !rule) {
                alert('请填写完整信息');
                return;
            }
            
            if (isNaN(score)) {
                alert('请输入有效的分值');
                return;
            }
            
            const res = await fetch('/api/monitor/record', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_name: studentName,
                    category: category,
                    rule: rule,
                    score: score,
                    recorder: userName,
                    remark: remark
                })
            });
            
            const data = await res.json();
            alert(data.success ? '✅ ' + data.message : '❌ ' + data.message);
            
            if (data.success) {
                // 清空表单
                document.getElementById('studentName').value = '';
                document.getElementById('recordScore').value = '';
                document.getElementById('recordRule').value = '';
                document.getElementById('recordRemark').value = '';
                loadData();
            }
        }
        
        async function handleHandover(e) {
            e.preventDefault();
            
            const summary = document.getElementById('handoverSummary').value.trim();
            const pending = document.getElementById('handoverPending').value.trim();
            const note = document.getElementById('handoverNote').value.trim();
            
            const res = await fetch('/api/monitor/handover', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    duty_monitor: userName,
                    summary: summary,
                    pending: pending,
                    note: note
                })
            });
            
            const data = await res.json();
            alert(data.success ? '✅ ' + data.message : '❌ ' + data.message);
            
            if (data.success) {
                document.getElementById('handoverSummary').value = '';
                document.getElementById('handoverPending').value = '';
                document.getElementById('handoverNote').value = '';
            }
        }
        
        // 初始化
        if (checkAuth()) {
            loadData();
        }
    </script>
</body>
</html>
